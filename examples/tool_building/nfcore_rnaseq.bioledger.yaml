spec_version: "0.1"
revision: "1"
execution:
  name: nfcore_rnaseq
  version: "3.14.0"
  description: "Wrap the nf-core/rnaseq pipeline as a BioLedger tool spec"
  executors:
    - nextflow
  # No container/conda_deps — Nextflow manages its own environment via profiles
  command: >-
    nextflow run nf-core/rnaseq -r 3.14.0
    --input {{inputs.samplesheet}}
    --outdir {{outputs._dir}}
    -profile test,docker
  inputs:
    samplesheet:
      type: file
      format: csv
      required: true
      description: "nf-core/rnaseq samplesheet (CSV with sample, fastq_1, fastq_2 columns)"
  outputs:
    results:
      type: directory
      pattern: "*"
      description: "Full rnaseq output directory (multiqc, star, etc.)"
  parameters:
    genome:
      type: string
      default: "GRCh38"
      required: false
      description: "Reference genome (passed as --genome)"
  categories:
    - pipeline
    - rna-seq
