spec_version: "0.1"
revision: "1"
execution:
  name: fastqc_nextflow
  version: "0.12.1"
  description: "Run FastQC quality control via Nextflow engine"
  executors:
    - nextflow
  command: >-
    fastqc {{inputs.reads}} -o {{outputs._dir}} -t {{parameters.threads}}
  inputs:
    reads:
      type: file
      format: fastq
      required: true
      description: "Input FASTQ reads"
  outputs:
    report:
      type: file
      format: html
      pattern: "*_fastqc.html"
      description: "QC report HTML"
  parameters:
    threads:
      type: integer
      default: 4
      min: 1
      max: 32
      required: false
      description: "Number of threads"
  categories:
    - quality-control
